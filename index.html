<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The No Button</title>
<meta name="description" content="A big red button that counts your nos. Practice saying no, one press at a time.">
<meta name="theme-color" content="#E6E7E3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="No Button">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="preload" href="fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Self-hosted fonts (SIL Open Font License, see fonts/): no requests to third parties */
  @font-face {
    font-family: "Bricolage Grotesque";
    src: url("fonts/bricolage-grotesque-latin.woff2") format("woff2");
    font-weight: 200 800;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("fonts/jetbrains-mono-latin.woff2") format("woff2");
    font-weight: 100 800;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --ground: #E6E7E3;
    --panel: #F4F4F1;
    --ink: #1D1F1C;
    --muted: #666A63;
    --line: #C9CBC4;
    --red: #D8261C;
    --red-deep: #9E150E;
    --red-hi: #FF5A45;
    --yellow: #F2C200;
    --yellow-deep: #B38F00;
    --tally: #1D1F1C;
    --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #17191A;
      --panel: #202324;
      --ink: #ECEDE8;
      --muted: #9A9E97;
      --line: #34383A;
      --tally: #ECEDE8;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #17191A;
    --panel: #202324;
    --ink: #ECEDE8;
    --muted: #9A9E97;
    --line: #34383A;
    --tally: #ECEDE8;
  }

  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--display);
    margin: 0;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
    padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    max-width: 460px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 22px;
    min-height: 100%;
  }

  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .brand { font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; }
  .date { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

  .today { display: grid; gap: 4px; text-align: center; }
  .today .label { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
  .count {
    font-weight: 800;
    font-size: clamp(4.5rem, 24vw, 7.5rem);
    line-height: 0.9;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
  }
  .count.bump { animation: bump 380ms cubic-bezier(.2,1.6,.4,1); }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.14); color: var(--red); } 100% { transform: scale(1); } }

  .tally { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 14px; min-height: 30px; }
  .tally svg { width: 38px; height: 28px; }
  .tally line { stroke: var(--tally); stroke-width: 2.4; stroke-linecap: round; }
  .tally .empty { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); align-self: center; }

  /* The E-stop: yellow housing, red mushroom cap */
  .stop-wrap { display: grid; place-items: center; padding-block: 8px; position: relative; }
  .housing {
    width: min(78vw, 300px);
    aspect-ratio: 1;
    max-width: 100%;
    border-radius: 22%;
    background: var(--yellow);
    box-shadow: inset 0 -8px 0 var(--yellow-deep), 0 10px 24px rgba(0,0,0,.18);
    display: grid;
    place-items: center;
    position: relative;
  }
  .ring-text {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .ring-text text { font-family: var(--mono); font-weight: 700; font-size: 11px; letter-spacing: 3.2px; fill: #1D1F1C; }
  .no-btn {
    width: 72%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 0;
    cursor: pointer;
    background: radial-gradient(circle at 35% 30%, var(--red-hi) 0%, var(--red) 45%, var(--red-deep) 100%);
    box-shadow: 0 12px 0 #6E0D08, 0 18px 26px rgba(0,0,0,.35), inset 0 -6px 12px rgba(0,0,0,.25);
    color: #FFF3EF;
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(2rem, 11vw, 3.1rem);
    letter-spacing: -0.02em;
    text-shadow: 0 2px 0 rgba(0,0,0,.25);
    transform: translateY(-6px);
    transition: transform 70ms ease-out, box-shadow 70ms ease-out;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    z-index: 1;
  }
  .no-btn:active, .no-btn.pressed {
    transform: translateY(6px);
    box-shadow: 0 1px 0 #6E0D08, 0 4px 8px rgba(0,0,0,.3), inset 0 -3px 8px rgba(0,0,0,.3);
  }
  .no-btn:focus-visible { outline: 4px solid var(--ink); outline-offset: 10px; }

  .burst {
    position: absolute; left: 50%; top: 45%;
    font-weight: 800; font-size: 1.6rem; color: var(--red);
    pointer-events: none; white-space: nowrap;
    animation: float 900ms ease-out forwards;
    z-index: 2;
  }
  @keyframes float {
    0% { opacity: 0; transform: translate(-50%, 0) scale(.7) rotate(var(--rot)); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), -150px) scale(1.15) rotate(var(--rot)); }
  }

  .message {
    text-align: center;
    font-weight: 500;
    font-size: 1.15rem;
    line-height: 1.35;
    min-height: 3.2em;
    text-wrap: balance;
    display: grid; place-items: center;
  }
  .message.milestone { color: var(--red); font-weight: 800; }

  .goal {
    display: grid; gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .goal-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .goal-top .label { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
  .stepper { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .stepper button {
    width: 30px; height: 30px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--ground); color: var(--ink);
    font-family: var(--mono); font-size: 1rem; cursor: pointer;
  }
  .stepper button:focus-visible, .undo:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--red); border-radius: 5px; transition: width 300ms ease; }
  .goal .status { font-size: 0.92rem; color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { display: grid; gap: 2px; padding-block: 4px; border-top: 2px solid var(--ink); }
  .stat b { font-family: var(--mono); font-weight: 700; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .stat span { font-family: var(--mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }

  .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: auto; }
  .undo {
    background: none; border: 0; padding: 6px 0; cursor: pointer;
    font-family: var(--mono); font-size: 0.8rem; color: var(--muted);
    text-decoration: underline; text-underline-offset: 3px;
  }
  .undo:disabled { opacity: .4; cursor: default; text-decoration: none; }
  .sound { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }

  @media (prefers-reduced-motion: reduce) {
    .count.bump, .burst { animation: none; }
    .burst { display: none; }
    .no-btn { transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">The No Button</div>
    <div class="date" id="date"></div>
  </header>

  <section class="today" aria-live="polite">
    <div class="label">Nos today</div>
    <div class="count" id="count">0</div>
  </section>

  <div class="tally" id="tally" aria-hidden="true"></div>

  <div class="stop-wrap" id="stopWrap">
    <div class="housing">
      <svg class="ring-text" viewBox="0 0 300 300" aria-hidden="true">
        <defs><path id="ring" d="M150,150 m-128,0 a128,128 0 1,1 256,0 a128,128 0 1,1 -256,0"></path></defs>
        <text><textPath id="ringText" href="#ring" textLength="798" lengthAdjust="spacing">PROTECT YOUR PEACE · PROTECT YOUR PEACE · PROTECT YOUR PEACE · PROTECT YOUR PEACE · </textPath></text>
      </svg>
      <button class="no-btn" id="noBtn" type="button" aria-label="I said no – count it">NO</button>
    </div>
  </div>

  <div class="message" id="message">Press the button whenever you said no today.</div>

  <section class="goal">
    <div class="goal-top">
      <div class="label">Daily goal</div>
      <div class="stepper">
        <button type="button" id="goalDown" aria-label="Decrease daily goal">−</button>
        <span id="goalVal">3</span>
        <button type="button" id="goalUp" aria-label="Increase daily goal">+</button>
      </div>
    </div>
    <div class="bar"><span id="goalBar"></span></div>
    <div class="status" id="goalStatus"></div>
  </section>

  <section class="stats">
    <div class="stat"><b id="week">0</b><span>This week</span></div>
    <div class="stat"><b id="total">0</b><span>All time</span></div>
    <div class="stat"><b id="streak">0</b><span>Day streak</span></div>
  </section>

  <div class="foot">
    <button class="undo" id="undo" type="button" disabled>Undo last no</button>
    <label class="sound"><input type="checkbox" id="soundToggle" checked> Sound</label>
  </div>
</div>

<script>
(function () {
  const KEY = "no-button-v1";
  const PHRASES = [
    "Saying no is self-care.",
    "Boundary set. Nicely done.",
    "You don't owe anyone an explanation.",
    "A no to them is a yes to you.",
    "Kind and clear. That's how it's done.",
    "Your time belongs to you.",
    "That took courage.",
    "Nobody's offended. And if they are, that's okay.",
    "Fewer obligations, more free evenings.",
    "Guilt is not a contract.",
    "You just saved some energy.",
    "Better an honest no than a half-hearted yes."
  ];
  const MILESTONES = {
    1: "Your first no! You've made a start.",
    5: "5 nos. You're getting the hang of it.",
    10: "10 nos! Your boundaries are taking shape.",
    25: "25 nos. That's a habit now.",
    50: "50 nos! Certified no pro.",
    100: "100 nos. Legendary.",
    250: "250 nos. People know where they stand with you.",
    500: "500 nos. You're a role model."
  };
  const SLOGANS = [
    "PROTECT YOUR PEACE",
    "YOUR TIME, YOUR RULES",
    "SAY NO WITHOUT GUILT",
    "BOUNDARIES ARE HEALTHY"
  ];
  const BURSTS = ["NO!", "Nope.", "Nah.", "No thanks.", "Pass.", "Count me out.", "Not today."];

  const $ = (id) => document.getElementById(id);
  let state = { events: [], goal: 3, sound: true, lastSlogan: -1 };
  let sessionAdds = 0;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (Array.isArray(s.events)) state.events = s.events.filter(n => typeof n === "number");
        if (Number.isInteger(s.goal)) state.goal = Math.min(20, Math.max(1, s.goal));
        if (typeof s.sound === "boolean") state.sound = s.sound;
        if (Number.isInteger(s.lastSlogan)) state.lastSlogan = s.lastSlogan;
      }
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  const dayKey = (d) => d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  function startOfWeek(d) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const wd = (x.getDay() + 6) % 7; // Monday = 0
    x.setDate(x.getDate() - wd);
    return x.getTime();
  }

  function compute() {
    const now = new Date();
    const todayKey = dayKey(now);
    const weekStart = startOfWeek(now);
    const days = new Set();
    let today = 0, week = 0;
    for (const t of state.events) {
      const d = new Date(t);
      const k = dayKey(d);
      days.add(k);
      if (k === todayKey) today++;
      if (t >= weekStart) week++;
    }
    // Streak: consecutive days with at least one no, ending today (or yesterday if none yet today)
    let streak = 0;
    const cur = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (!days.has(dayKey(cur))) cur.setDate(cur.getDate() - 1);
    while (days.has(dayKey(cur))) { streak++; cur.setDate(cur.getDate() - 1); }
    return { today, week, total: state.events.length, streak };
  }

  function tallySvg(n) {
    let s = '<svg viewBox="0 0 38 28">';
    const xs = [5, 12, 19, 26];
    for (let i = 0; i < Math.min(n, 4); i++) s += `<line x1="${xs[i]}" y1="3" x2="${xs[i]}" y2="25"></line>`;
    if (n >= 5) s += '<line x1="1" y1="21" x2="31" y2="7"></line>';
    return s + "</svg>";
  }

  function render() {
    const c = compute();
    $("count").textContent = c.today;
    $("week").textContent = c.week;
    $("total").textContent = c.total;
    $("streak").textContent = c.streak;
    $("goalVal").textContent = state.goal;
    $("soundToggle").checked = state.sound;
    $("undo").disabled = sessionAdds === 0;

    const tally = $("tally");
    if (c.today === 0) {
      tally.innerHTML = '<span class="empty">No tally marks yet today</span>';
    } else {
      let html = "";
      const shown = Math.min(c.today, 50);
      for (let i = 0; i < shown; i += 5) html += tallySvg(Math.min(5, shown - i));
      tally.innerHTML = html;
    }

    const pct = Math.min(100, (c.today / state.goal) * 100);
    $("goalBar").style.width = pct + "%";
    const left = state.goal - c.today;
    $("goalStatus").textContent =
      left > 0 ? `${left} more ${left === 1 ? "no" : "nos"} to reach your daily goal.`
      : left === 0 ? "Daily goal reached. Strong!"
      : `Daily goal beaten by ${-left}.`;

    $("date").textContent = new Date().toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
  }

  let audioCtx = null;
  function thunk() {
    if (!state.sound) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "square";
      o.frequency.setValueAtTime(220, t);
      o.frequency.exponentialRampToValueAtTime(70, t + 0.18);
      g.gain.setValueAtTime(0.18, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      o.connect(g).connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.24);
    } catch (e) {}
  }

  function burst() {
    const el = document.createElement("div");
    el.className = "burst";
    el.textContent = BURSTS[Math.floor(Math.random() * BURSTS.length)];
    el.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
    el.style.setProperty("--rot", (Math.random() * 24 - 12) + "deg");
    $("stopWrap").appendChild(el);
    setTimeout(() => el.remove(), 950);
  }

  function say(text, milestone) {
    const m = $("message");
    m.textContent = text;
    m.classList.toggle("milestone", !!milestone);
  }

  function press() {
    const before = compute();
    state.events.push(Date.now());
    sessionAdds++;
    save();
    render();
    const after = compute();

    const cnt = $("count");
    cnt.classList.remove("bump"); void cnt.offsetWidth; cnt.classList.add("bump");
    burst();
    thunk();
    try { navigator.vibrate && navigator.vibrate(35); } catch (e) {}

    if (MILESTONES[after.total]) say(MILESTONES[after.total], true);
    else if (before.today < state.goal && after.today === state.goal) say("Daily goal reached! You looked after yourself today.", true);
    else say(PHRASES[Math.floor(Math.random() * PHRASES.length)]);
  }

  const btn = $("noBtn");
  btn.addEventListener("click", press);
  btn.addEventListener("pointerdown", () => btn.classList.add("pressed"));
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => btn.addEventListener(ev, () => btn.classList.remove("pressed")));

  $("undo").addEventListener("click", () => {
    if (sessionAdds === 0 || state.events.length === 0) return;
    state.events.pop();
    sessionAdds--;
    save(); render();
    say("Undone. Only count the real nos.");
  });
  $("goalUp").addEventListener("click", () => { state.goal = Math.min(20, state.goal + 1); save(); render(); });
  $("goalDown").addEventListener("click", () => { state.goal = Math.max(1, state.goal - 1); save(); render(); });
  $("soundToggle").addEventListener("change", (e) => { state.sound = e.target.checked; save(); });

  // Refresh "today" when the day rolls over while the page is open
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
  setInterval(render, 60000);

  // A different slogan around the button every time the app opens
  function pickSlogan() {
    let i = Math.floor(Math.random() * SLOGANS.length);
    if (i === state.lastSlogan) i = (i + 1 + Math.floor(Math.random() * (SLOGANS.length - 1))) % SLOGANS.length;
    state.lastSlogan = i;
    save();
    const unit = SLOGANS[i] + " · ";
    const reps = Math.max(1, Math.round(84 / unit.length));
    $("ringText").textContent = unit.repeat(reps);
  }

  load();
  pickSlogan();
  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
})();
</script>
</body>
</html>
